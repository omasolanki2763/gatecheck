[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gatecheck"
version = "0.1.0"
description = "Eligibility verification screener for GATE candidates against PSU/IIT notifications"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "ruff==0.17.3",
    "mypy>=1.15.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pre-commit>=4.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = [
    "E",        # pycodestyle errors
    "W",        # pycodestyle warnings
    "F",        # Pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "D",        # pydocstyle
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "BLE",      # flake8-blind-except
    "S",        # flake8-bandit
    "PLR2004",  # magic-value-comparison
    "PLW1514",  # unspecified-encoding (preview rule)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]  # S101 allows assert; PLR2004 allows comparison literals in test assertions

[tool.mypy]
python_version = "3.13"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=gatecheck --cov-branch"
